[project]
name = "fruitful-repo-snapshotter"
version = "0.1.0"
description = "Two-pass repo snapshotter worker (Pass1 deterministic index + Pass2 LLM semantic outputs) uploading artifacts to S3 with SSE-S3 AES256."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "botocore>=1.34.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "types-boto3>=1.0.2",
  "types-python-dateutil>=2.9.0.20240316",
]

[tool.uv]
# Keeps uv happy if you're using `uv run ...`
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # optional: allow long lines if you prefer

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict = false

[tool.pytest.ini_options]
# Only matters if you add tests later
testpaths = ["tests"]
